syntax = "proto3";

option csharp_namespace = "WalletAPI.Protos";

package wallet;

service WalletService {
  rpc AddCoin (AddCoinRequest) returns (AddCoinResponse);
}

message AddCoinRequest {
  string userId = 1;
  double amount = 2; // gRPC uses double for precision, we'll cast to decimal in C#
  string referenceId = 3;
  string description = 4;
  // "ManualTopUp" = withdrawable real money; empty/other = MissionReward (not withdrawable, fail-closed).
  string creditType = 5;
}

message AddCoinResponse {
  bool success = 1;
  string message = 2;
}
